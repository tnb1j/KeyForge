[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keyforge"
version = "1.0.0"
description = "Universal Adaptive Software Key & License Management Framework"
readme = "README.md"
authors = [{ name = "KeyForge Architecture Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.28",
    "cryptography>=42.0.0",
    "argon2-cffi>=23.1.0",
    "httpx>=0.27.0",
]

[project.scripts]
keyforge = "keyforge.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
